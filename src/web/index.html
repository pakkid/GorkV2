<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gork</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f2ef; --panel: #fcfcfb; --text: #0b0b0b; --text-2: #52514e; --muted: #7a7873;
    --line: #e2e0da; --grid: #ecebe7; --accent: #5865f2; --danger: #c93c3c; --chip: #eceaf9;
    --series-1: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #121211; --panel: #1a1a19; --text: #f0efec; --text-2: #c3c2b7; --muted: #8d8c85;
      --line: #2c2c2a; --grid: #252523; --accent: #7c86ff; --danger: #ff6b6b; --chip: #2a2b45;
      --series-1: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 80px; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; flex: 1; }
  h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  .tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .tabs a { padding: 6px 14px; border-radius: 7px; color: var(--text-2); text-decoration: none; }
  .tabs a[aria-current] { background: var(--accent); color: #fff; }
  .sub { color: var(--text-2); margin: 0 0 20px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  select, input, textarea, button { font: inherit; color: inherit; }
  select, input[type=search] {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  select { flex: 1 1 240px; min-width: 0; }
  input[type=search] { flex: 1 1 200px; min-width: 0; }
  button {
    border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
    padding: 8px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 8px 12px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed=true] { background: var(--text); color: var(--panel); }
  textarea:focus, select:focus, input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  [hidden] { display: none !important; }

  /* stats */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .tile, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile .label { color: var(--text-2); font-size: 13px; }
  .tile .value { font-size: 26px; font-weight: 650; letter-spacing: -.01em; line-height: 1.25; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .tile .note { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 10px; margin-bottom: 10px; }
  .card { position: relative; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .axis { stroke: var(--line); }
  .gridline { stroke: var(--grid); }
  .hit { fill: transparent; }
  .hit:hover + .hover, .col:hover .hover { opacity: 1; }
  .hover { fill: var(--text); opacity: 0; pointer-events: none; }
  .rank { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .rank td { padding: 5px 0; font-size: 14px; vertical-align: middle; }
  .rank td.name { width: 38%; padding-right: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 0; }
  .rank td.name small { color: var(--muted); }
  .rank td.num { width: 64px; text-align: right; color: var(--text-2); padding-left: 8px; }
  .rank .track { height: 10px; }
  .rank .fill { height: 10px; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }
  table.models { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  table.models th { text-align: left; color: var(--text-2); font-weight: 500; font-size: 13px; border-bottom: 1px solid var(--line); padding: 6px 8px 6px 0; }
  table.models td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--grid); }
  table.models .r { text-align: right; }
  .scroll { overflow-x: auto; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  #tip {
    position: fixed; z-index: 10; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgb(0 0 0 / .15);
    font-variant-numeric: tabular-nums; min-width: 140px;
  }
  #tip b { display: block; margin-bottom: 4px; }
  #tip .row { display: flex; gap: 12px; justify-content: space-between; color: var(--text-2); }
  #tip .row span:last-child { color: var(--text); }
  #tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

  /* memory */
  .add { display: flex; gap: 8px; margin-bottom: 20px; }
  .add textarea { flex: 1; }
  textarea {
    width: 100%; resize: vertical; min-height: 40px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li.note {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .chip { background: var(--chip); color: var(--accent); border-radius: 99px; padding: 0 8px; font-size: 12px; }
  .meta .spacer { flex: 1; }
  .meta button { padding: 2px 8px; font-size: 13px; }
  .dirty textarea { border-color: var(--accent); }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; color: var(--muted); font-size: 13px; }
  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <header>
    <h1>gork</h1>
    <nav class="tabs">
      <a href="#stats" id="tabStats">Stats</a>
      <a href="#memory" id="tabMemory">Memory</a>
    </nav>
  </header>

  <section id="statsView">
    <div class="bar">
      <select id="statsScope" aria-label="Server"></select>
      <div class="seg" id="range" role="group" aria-label="Time range">
        <button data-days="1">24h</button>
        <button data-days="7">7d</button>
        <button data-days="30">30d</button>
        <button data-days="90">90d</button>
        <button data-days="365">1y</button>
      </div>
    </div>

    <div class="tiles" id="tiles"></div>

    <div class="grid">
      <div class="card">
        <div class="head"><h2>Input tokens per day</h2></div>
        <div class="chart" id="inputChart"></div>
      </div>
      <div class="card">
        <div class="head"><h2>Output tokens per day</h2></div>
        <div class="chart" id="outputChart"></div>
      </div>
      <div class="card">
        <div class="head"><h2>Cost per day</h2></div>
        <div class="chart" id="costChart"></div>
      </div>
      <div class="card">
        <div class="head"><h2>Messages gork sent per day</h2></div>
        <div class="chart" id="sentChart"></div>
      </div>
      <div class="card">
        <div class="head"><h2>Most messages</h2><span class="sub" style="margin:0;font-size:13px">people, from the archive</span></div>
        <div id="chatters"></div>
      </div>
      <div class="card">
        <div class="head"><h2>Busiest channels</h2><span class="sub" style="margin:0;font-size:13px">all messages, hover for gork's share</span></div>
        <div id="channels"></div>
      </div>
      <div class="card wide">
        <div class="head"><h2>Models</h2></div>
        <div class="scroll" id="models"></div>
      </div>
    </div>
  </section>

  <section id="memoryView" hidden>
    <p class="sub">Notes gork keeps about each server. He sees the newest ones every time he talks.</p>
    <div class="bar">
      <select id="scope" aria-label="Server"></select>
      <input id="filter" type="search" placeholder="Filter notes" aria-label="Filter notes">
    </div>
    <form class="add" id="add">
      <textarea id="newText" rows="1" maxlength="300" placeholder="Add a note, e.g. niko owes sam 20 bucks"></textarea>
      <button class="primary" type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <div class="foot">
      <span id="count"></span>
      <button class="danger" id="wipe" type="button">Wipe all notes</button>
    </div>
  </section>
</main>
<div id="tip" hidden></div>
<div id="toast" role="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'content-type': 'application/json', 'x-gork': '1' },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `error ${res.status}`);
  return data;
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

function el(tag, attrs = {}, ...kids) {
  const ns = ['svg', 'rect', 'line', 'text', 'g', 'path'].includes(tag) ? 'http://www.w3.org/2000/svg' : null;
  const e = ns ? document.createElementNS(ns, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  e.append(...kids);
  return e;
}

// ---------------------------------------------------------------- tabs
function showTab() {
  const memory = location.hash === '#memory';
  $('statsView').hidden = memory;
  $('memoryView').hidden = !memory;
  $('tabStats').toggleAttribute('aria-current', !memory);
  $('tabMemory').toggleAttribute('aria-current', memory);
  if (memory) loadScopes().then(loadNotes).catch((e) => toast(e.message));
  else loadStats();
}
addEventListener('hashchange', showTab);

// ---------------------------------------------------------------- stats
const n0 = new Intl.NumberFormat();
const compact = new Intl.NumberFormat(undefined, { notation: 'compact', maximumFractionDigits: 1 });
const money = (v) => v === 0 ? '$0' : v < 0.01 ? `$${v.toFixed(4)}` : v < 10 ? `$${v.toFixed(3)}` : `$${v.toFixed(2)}`;
const pct = (a, b) => (b ? `${Math.round((a / b) * 100)}%` : '–');
const dayLabel = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });
const fmtDay = (d) => dayLabel.format(new Date(`${d}T00:00:00Z`));

let statsData = null;
let days = Number(store.get('days')) || 30;

async function loadStats() {
  const scope = $('statsScope').value || store.get('statsScope') || 'all';
  try {
    statsData = await api(`/api/stats?scope=${scope}&days=${days}`);
  } catch (e) { toast(e.message); return; }
  const sel = $('statsScope');
  sel.replaceChildren(new Option('All servers', 'all'), ...statsData.servers.map((s) => new Option(s.name, s.id)));
  sel.value = statsData.servers.some((s) => s.id === scope) ? scope : 'all';
  for (const b of $('range').children) b.setAttribute('aria-pressed', String(Number(b.dataset.days) === days));
  renderStats();
}

$('statsScope').addEventListener('change', () => { store.set('statsScope', $('statsScope').value); loadStats(); });
$('range').addEventListener('click', (e) => {
  const d = Number(e.target.dataset?.days);
  if (!d) return;
  days = d;
  store.set('days', String(d));
  loadStats();
});

function renderStats() {
  const d = statsData;
  const t = d.totals;
  const tokens = t.input + t.output;
  const span = days === 1 ? 'last 24h' : `last ${days} days`;
  const tiles = [
    ['API cost', money(t.cost), `${money(d.lifetime.cost)} all time${t.historyCost ? ` · ${money(t.historyCost)} of it estimated from before tracking` : ''}${t.uncosted ? ` · ${n0.format(t.uncosted)} calls unpriced` : ''}`],
    ['Tokens', compact.format(tokens), `${compact.format(t.input)} in · ${compact.format(t.output)} out${t.cached ? ` · ${compact.format(t.cached)} cached` : ''}${t.estimated ? ` · ${t.estimated === t.calls ? 'all' : pct(t.estimated, t.calls) + ' of calls'} estimated` : ''}`],
    ['Messages sent', n0.format(t.sent), `${n0.format(t.replies)} replies · ${n0.format(t.sent - t.replies)} plain`],
    ['Model calls', n0.format(t.calls), `${t.ms ? `${(t.ms / 1000).toFixed(1)}s avg` : '–'}${t.failed ? ` · ${n0.format(t.failed)} failed` : ''}${t.historyCalls ? ` · ${n0.format(t.historyCalls)} rebuilt from history` : ''}`],
    ['Talked', pct(t.spoke, t.turns), `spoke in ${n0.format(t.spoke)} of ${n0.format(t.turns)} looks · ${n0.format(t.pinged)} pings`],
    ['Messages seen', compact.format(t.seen), `in the archive, ${span}`],
  ];
  $('tiles').replaceChildren(...tiles.map(([label, value, note]) =>
    el('div', { class: 'tile' }, el('div', { class: 'label', text: label }), el('div', { class: 'value', text: value }), el('div', { class: 'note', text: note }))));

  // input dwarfs output (whole transcript in, a few lines out), so they get their own scales
  barChart($('inputChart'), d.daily, [{ key: 'input', label: 'Input tokens', color: 'var(--series-1)' }], compact.format, 160);
  barChart($('outputChart'), d.daily, [{ key: 'output', label: 'Output tokens', color: 'var(--series-1)' }], compact.format, 160);
  barChart($('costChart'), d.daily, [{ key: 'cost', label: 'Cost', color: 'var(--series-1)' }], money, 160);
  barChart($('sentChart'), d.daily, [{ key: 'sent', label: 'Messages', color: 'var(--series-1)' }], n0.format, 160);

  rankList($('chatters'), d.topChatters.map((c) => ({ name: c.name, value: c.count })));
  rankList($('channels'), d.topChannels.map((c) => ({
    name: c.name, sub: !statsData.servers.find((s) => s.id === $('statsScope').value) && c.server ? c.server : '',
    value: c.count, extra: c.gork ? `gork ${pct(c.gork, c.count)}` : '',
  })));
  modelsTable(d.models);
}

/** Vertical bars per day, stacked when there's more than one series. One y axis. */
function barChart(host, rows, series, fmt, height) {
  const width = Math.max(280, host.clientWidth || 600);
  const pad = { l: 44, r: 4, t: 8, b: 22 };
  const w = width - pad.l - pad.r;
  const h = height - pad.t - pad.b;
  const totals = rows.map((r) => series.reduce((s, x) => s + r[x.key], 0));
  const max = niceMax(Math.max(0, ...totals));
  const svg = el('svg', { viewBox: `0 0 ${width} ${height}`, height, role: 'img', 'aria-label': series.map((s) => s.label).join(' and ') + ' per day' });
  if (!totals.some((v) => v > 0)) {
    host.replaceChildren(el('div', { class: 'empty', text: 'Nothing yet in this range.' }));
    return;
  }
  for (const f of [0, 0.5, 1]) {
    const y = pad.t + h - f * h;
    svg.append(el('line', { class: f ? 'gridline' : 'axis', x1: pad.l, x2: width - pad.r, y1: y, y2: y }));
    svg.append(el('text', { x: pad.l - 6, y: y + 4, 'text-anchor': 'end', text: fmt(max * f) }));
  }
  const step = w / rows.length;
  const bw = Math.max(1, Math.min(28, step - (rows.length > 60 ? 1 : 2)));
  const labelEvery = Math.ceil(rows.length / Math.max(2, Math.floor(w / 64)));
  rows.forEach((r, i) => {
    const x = pad.l + i * step + (step - bw) / 2;
    const g = el('g', { class: 'col' });
    let y = pad.t + h;
    series.forEach((s, si) => {
      const v = r[s.key];
      if (v <= 0) return;
      const bh = Math.max(1, (v / max) * h);
      const top = si === series.length - 1 || series.slice(si + 1).every((n) => r[n.key] <= 0);
      // 2px surface gap between stacked segments
      const gap = si > 0 ? 2 : 0;
      g.append(el('path', { d: barPath(x, y - bh, bw, bh - gap, top ? Math.min(4, bw / 2) : 0), fill: s.color }));
      y -= bh;
    });
    if ((rows.length - 1 - i) % labelEvery === 0) {
      svg.append(el('text', { x: x + bw / 2, y: height - 6, 'text-anchor': 'middle', text: fmtDay(r.day) }));
    }
    const hit = el('rect', { class: 'hit', x: pad.l + i * step, y: pad.t, width: step, height: h });
    hit.addEventListener('mousemove', (e) => tip(e, fmtDay(r.day), series.map((s) => [s.label, fmt(r[s.key]), s.color]).concat(series.length > 1 ? [['Total', fmt(totals[i])]] : [])));
    hit.addEventListener('mouseleave', hideTip);
    g.append(hit);
    svg.append(g);
  });
  host.replaceChildren(svg);
}

function barPath(x, y, w, h, r) {
  if (h <= 0) return '';
  r = Math.min(r, h);
  return `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h} Z`;
}

function niceMax(v) {
  if (v <= 0) return 1;
  const p = 10 ** Math.floor(Math.log10(v));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

function rankList(host, rows) {
  if (!rows.length) { host.replaceChildren(el('div', { class: 'empty', text: 'Nothing in the archive for this range.' })); return; }
  const max = Math.max(...rows.map((r) => r.value));
  host.replaceChildren(el('table', { class: 'rank' }, el('tbody', {}, ...rows.map((r) =>
    el('tr', {},
      el('td', { class: 'name', title: r.name }, r.name, r.sub ? el('small', { text: ` · ${r.sub}` }) : ''),
      el('td', {}, el('div', { class: 'track' }, el('div', { class: 'fill', style: `width:${(r.value / max) * 100}%` }))),
      el('td', { class: 'num', text: compact.format(r.value), title: `${n0.format(r.value)}${r.extra ? ` · ${r.extra}` : ''}` }),
    )))));
}

function modelsTable(models) {
  if (!models.length) { $('models').replaceChildren(el('div', { class: 'empty', text: 'No model calls in this range.' })); return; }
  const head = ['Model', 'Used for', 'Calls', 'Input', 'Output', 'Cost', 'Avg time', 'Failed'];
  $('models').replaceChildren(el('table', { class: 'models' },
    el('thead', {}, el('tr', {}, ...head.map((h, i) => el('th', { class: i > 1 ? 'r' : '', text: h })))),
    el('tbody', {}, ...models.map((m) => el('tr', {},
      el('td', { text: m.model }),
      el('td', { text: m.kind === 'notes' ? 'memory rebuild' : m.kind === 'history' ? 'chat, before tracking (est.)' : 'chat' }),
      el('td', { class: 'r', text: n0.format(m.calls) }),
      el('td', { class: 'r', text: compact.format(m.input) }),
      el('td', { class: 'r', text: compact.format(m.output) }),
      el('td', { class: 'r', text: m.uncosted === m.calls ? 'unpriced' : money(m.cost) + (m.uncosted ? '*' : '') }),
      el('td', { class: 'r', text: m.ms ? `${(m.ms / 1000).toFixed(1)}s` : '–' }),
      el('td', { class: 'r', text: n0.format(m.failed) }),
    )))));
}

function tip(e, title, rows) {
  const t = $('tip');
  t.replaceChildren(el('b', { text: title }), ...rows.map(([k, v, c]) =>
    el('div', { class: 'row' }, el('span', {}, c ? el('i', { style: `background:${c}` }) : '', k), el('span', { text: v }))));
  t.hidden = false;
  const x = Math.min(e.clientX + 14, innerWidth - t.offsetWidth - 8);
  const y = e.clientY - t.offsetHeight - 12 < 8 ? e.clientY + 16 : e.clientY - t.offsetHeight - 12;
  t.style.left = `${x}px`;
  t.style.top = `${y}px`;
}
function hideTip() { $('tip').hidden = true; }

let resizeTimer;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (statsData && !$('statsView').hidden) renderStats(); }, 150);
});
setInterval(() => { if (!$('statsView').hidden && !document.hidden) loadStats(); }, 60_000);

// ---------------------------------------------------------------- memory
let info = { scopes: [], inPrompt: 40, max: 200 };
let notes = [];
const fmt = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });

async function loadScopes() {
  info = await api('/api/scopes');
  const sel = $('scope');
  const keep = sel.value || store.get('scope');
  sel.replaceChildren(...info.scopes.map((s) => new Option(`${s.name} (${s.count})`, s.id)));
  if (keep && info.scopes.some((s) => s.id === keep)) sel.value = keep;
}

async function loadNotes() {
  const scope = $('scope').value;
  notes = scope ? (await api(`/api/notes?scope=${scope}`)).notes : [];
  renderNotes();
}

function renderNotes() {
  const q = $('filter').value.trim().toLowerCase();
  // notes come oldest first; the newest `inPrompt` are the ones gork sees
  const seen = new Set(notes.slice(-info.inPrompt).map((n) => n.id));
  const shown = notes.filter((n) => !q || n.text.toLowerCase().includes(q)).reverse();
  const list = $('list');
  list.replaceChildren();
  if (!shown.length) {
    list.append(el('li', { class: 'note empty', text: $('scope').value ? (q ? 'Nothing matches.' : 'He remembers nothing here yet.') : 'No servers.' }));
  }
  for (const n of shown) list.append(noteRow(n, seen.has(n.id)));
  $('count').textContent = `${notes.length} of max ${info.max} notes`;
  $('wipe').disabled = !notes.length;
}

function noteRow(n, inPrompt) {
  const save = el('button', { text: 'Save' });
  save.hidden = true;
  const del = el('button', { class: 'danger', text: 'Delete' });
  const text = el('textarea', { maxlength: 300, rows: Math.max(1, Math.ceil(n.text.length / 80)) });
  text.value = n.text;
  const li = el('li', { class: 'note' },
    el('div', { class: 'meta' },
      el('span', { text: `#${n.id} · ${fmt.format(n.created_at)}` }),
      inPrompt ? el('span', { class: 'chip', text: 'in prompt', title: 'gork sees this note every turn' }) : '',
      el('span', { class: 'spacer' }), save, del),
    text);
  text.addEventListener('input', () => {
    const dirty = text.value.trim() !== n.text;
    li.classList.toggle('dirty', dirty);
    save.hidden = !dirty;
  });
  text.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!save.hidden) save.click(); }
    if (e.key === 'Escape') { text.value = n.text; text.dispatchEvent(new Event('input')); }
  });
  save.addEventListener('click', async () => {
    try {
      await api(`/api/notes/${n.id}`, { method: 'PATCH', body: { text: text.value } });
      n.text = text.value.replace(/\s+/g, ' ').trim();
      text.value = n.text;
      text.dispatchEvent(new Event('input'));
      toast('saved');
    } catch (e) { toast(e.message); }
  });
  del.addEventListener('click', async () => {
    try {
      await api(`/api/notes/${n.id}`, { method: 'DELETE' });
      notes = notes.filter((x) => x.id !== n.id);
      renderNotes();
      toast('deleted');
      loadScopes();
    } catch (e) { toast(e.message); }
  });
  return li;
}

$('scope').addEventListener('change', () => {
  store.set('scope', $('scope').value);
  loadNotes().catch((e) => toast(e.message));
});
$('filter').addEventListener('input', renderNotes);

$('add').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('newText').value.trim();
  if (!text || !$('scope').value) return;
  try {
    await api('/api/notes', { method: 'POST', body: { scope: $('scope').value, text } });
    $('newText').value = '';
    await Promise.all([loadNotes(), loadScopes()]);
    toast('added');
  } catch (e) { toast(e.message); }
});
$('newText').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('add').requestSubmit(); }
});

$('wipe').addEventListener('click', async () => {
  const name = $('scope').selectedOptions[0]?.textContent;
  if (!confirm(`Delete all ${notes.length} notes for ${name}? This can't be undone.`)) return;
  try {
    const { removed } = await api(`/api/notes?scope=${$('scope').value}`, { method: 'DELETE' });
    await Promise.all([loadNotes(), loadScopes()]);
    toast(`wiped ${removed} notes`);
  } catch (e) { toast(e.message); }
});

showTab();
</script>
</body>
</html>
