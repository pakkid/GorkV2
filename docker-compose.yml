# Portainer: Stacks -> Add stack -> Repository, point it at this repo,
# then fill in the environment variables below in the stack's env section.
services:
  gork:
    build: .
    # always build from the repo; there is no gork image on docker hub to pull
    pull_policy: build
    container_name: gork
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_OWNER_ID: ${DISCORD_OWNER_ID:-}
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-deepseek/deepseek-v4.1-flash}
      AI_FALLBACK_MODELS: ${AI_FALLBACK_MODELS:-minimax-m3.1-flash,z-ai/glm-5.3-flash}
      AI_REASONING: ${AI_REASONING:-}
      AI_PRICES: ${AI_PRICES:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # gork's clock and hometown. match these to where your server's people are
      TZ: ${TZ:-America/New_York}
      GORK_LOCATION: ${GORK_LOCATION:-New York, USA}
      WEB_PORT: 8787
    # memory editor web ui. set WEB_BIND to this host's LAN ip (e.g. 192.168.1.20) so it
    # only listens there; gork also refuses anything that isn't a private-network address
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_HOST_PORT:-8787}:8787"
    volumes:
      - gork-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  gork-data:
